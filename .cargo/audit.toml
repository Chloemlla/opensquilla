# cargo-audit configuration.
#
# All five ignored advisories below are DoS-class (stack overflow / memory
# exhaustion / quadratic runtime) reachable only when parsing untrusted
# PDF / XLSX / DNS input. They originate in transitive deps of
# `opensquilla-tools`'s document-handling code. The direct workspace deps
# (`lopdf`, `pdf-extract`, `printpdf`, `calamine`, `trust-dns-resolver`) pin
# vulnerable majors; upgrading them crosses breaking-version boundaries
# (lopdf 0.34→0.42, calamine 0.26→0.36) and requires API migration that is
# tracked as a separate task. Ignoring here unblocks the nightly audit job
# without masking the issue — each entry has a reason and revisit date.

[advisories]
# cargo-audit >= 0.21 accepts only plain RUSTSEC-IDs here; the old
# `[[advisories.ignore]]` table form (id/reason) is rejected with
# "invalid type: map, expected a string". Each ID below corresponds to a
# DoS-class advisory (stack overflow / memory exhaustion / quadratic
# runtime) reachable only when parsing untrusted PDF / XLSX / DNS input via
# transitive deps of `opensquilla-tools`'s document-handling code. Upgrading
# the direct pins crosses breaking-version boundaries and is tracked
# separately.
advisories.ignore = [
    # lopdf 0.34 / 0.35 — stack overflow via deeply nested PDF objects.
    # Reached via pdf-extract 0.8.2 and printpdf 0.8.2. Revisit after 2026-11-01.
    "RUSTSEC-2026-0187",
    # idna 0.4.0 — Punycode labels that decode to all-ASCII.
    # Reached via trust-dns-resolver 0.23.2. Revisit after 2026-11-01.
    "RUSTSEC-2024-0421",
    # quick-xml 0.31.0 — quadratic runtime on duplicate start-tag attributes.
    # Reached via calamine 0.26.1. Revisit after 2026-11-01.
    "RUSTSEC-2026-0194",
    # quick-xml 0.31.0 — NsReader unbounded namespace-decl allocation.
    # Same root as RUSTSEC-2026-0194. Revisit after 2026-11-01.
    "RUSTSEC-2026-0195",
]
