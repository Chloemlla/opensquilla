[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/gateway",
    "crates/engine",
    "crates/provider",
    "crates/tools",
    "crates/session",
    "crates/memory",
    "crates/channels",
    "crates/sandbox",
    "crates/skills",
    "crates/scheduler",
    "crates/cli",
    "crates/mcp",
    "crates/safety",
    "crates/search",
    "crates/observability",
    "crates/onboarding",
    "crates/recovery",
    "crates/eval",
    "crates/identity",
    "crates/persistence",
    "crates/health",
    "crates/plugins",
    "crates/uninstall",
    "crates/chat",
    "crates/contrib",
    "crates/agents",
    "src-tauri",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["OpenSquilla Contributors"]
license = "Apache-2.0"
repository = "https://github.com/Chloemlla/opensquilla"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# HTTP
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "limit", "validate-request"] }
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "brotli"] }
tokio-tungstenite = "0.24"
http = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Database
rusqlite = { version = "0.32", features = ["bundled", "vtab", "column_decltype"] }

# ML
ort = "2.0.0-rc.13"
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
ndarray = "0.16"

# Text processing
regex = "1"
tokenizers = "0.21"
jieba-rs = "0.7"
tiktoken-rs = "0.6"

# CLI
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
opentelemetry = "0.27"

# File system
notify = "7"
notify-debouncer-mini = "0.5"

# System
nix = { version = "0.29", features = ["fs", "mount", "process", "resource", "sched", "signal", "user"] }
windows = { version = "0.58", features = [
    "Security_Authorization",
    "System_Threading",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_NetworkManagement",
    "Win32_Foundation",
] }

# Image
image = "0.25"

# PDF
lopdf = "0.34"
pdf-extract = "0.8"

# HTML
scraper = "0.21"

# Excel
calamine = "0.26"

# Template
tera = "1"

# Cron
cron = "0.13"

# DNS
trust-dns-resolver = "0.23"

# Seccomp-BPF (Linux sandbox)
seccompiler = "0.4"

# JSON Schema
jsonschema = "0.23"

# MCP
rmcp = "0.1"

# SSE
eventsource-stream = "0.2"

# Async trait
async-trait = "0.1"

# Common utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
once_cell = "1"
parking_lot = "0.12"
dashmap = "6"
rand = "0.8"
shellexpand = "3"
dirs = "6"
url = "2"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
glob = "0.3"
walkdir = "2"
mime = "0.3"
mime_guess = "2"
bytes = "1"
byteorder = "1"
data-encoding = "2"

# Release profile for all workspace crates: optimize for binary size, full LTO,
# single codegen unit, strip symbols, and abort on panic. Matches
# src-tauri/Cargo.toml's crate-local override (kept identical for clarity).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"