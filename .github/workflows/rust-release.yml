name: Rust Release

# Builds, signs, and publishes the OpenSquilla Tauri v2 desktop app for
# Windows (MSI + NSIS), macOS (universal .app + .dmg), and Linux (deb +
# AppImage). Runs on tag pushes (v*) and can be triggered manually.
#
# The per-platform jobs use `tauri-apps/tauri-action@v0`, which:
#   - builds the app (`cargo tauri build`, running the `beforeBuildCommand`
#     frontend build automatically),
#   - signs the updater artifacts when TAURI_SIGNING_PRIVATE_KEY is present,
#   - generates and uploads the auto-updater manifest (`latest.json`),
#   - creates/updates the GitHub Release (draft) and uploads the bundles.
#
# A final `publish-release` job downloads the draft assets, regenerates
# SHA256SUMS, validates the update manifest, and uploads the checksums.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (must already exist and match tauri.conf.json version)
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: rust-release-${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag || github.run_id }}
  cancel-in-progress: false

env:
  # Tag that tauri-action should publish to. On a push, it is the pushed tag;
  # on manual dispatch it is the tag input (falls back to the current ref).
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag || github.ref_name }}
  # Node >= 22.12 required by opensquilla-webui (see opensquilla-webui/.node-version).
  NODE_VERSION_FILE: opensquilla-webui/.node-version

jobs:
  build-windows:
    name: Build Windows (MSI + NSIS)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm
          cache-dependency-path: opensquilla-webui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The WebUI is built by tauri-action automatically via the
      # `beforeBuildCommand` (scripts/build-frontend.mjs -> npm ci + npm run build).
      # Node is already on PATH so `node` resolves.

      - name: Build and release (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing keypair (see scripts/generate-updater-key.sh).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}
          # Windows Authenticode certificate (base64 .pfx) + password.
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "OpenSquilla ${{ env.RELEASE_TAG }}"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          projectPath: src-tauri
          args: --target x86_64-pc-windows-msvc --bundles msi nsis

      # `bundle.windows.signCommand` (tauri.conf.json) signs the main binary
      # inside the installer. Sign the outer NSIS setup.exe too so the
      # downloadable installer itself is Authenticode-signed.
      - name: Sign NSIS installer
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe' -ErrorAction SilentlyContinue
          if ($setup -and $env:WINDOWS_CERTIFICATE) {
            & pwsh -NoProfile -ExecutionPolicy Bypass -File 'scripts/sign-windows.ps1' $setup.FullName
          } else {
            Write-Host 'No NSIS setup.exe or no certificate; skipping installer signing.'
          }

      - name: List Windows bundles
        shell: pwsh
        run: |
          Get-ChildItem -Recurse 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle' -File | Select-Object FullName

      - name: Upload Windows bundles (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: opensquilla-release-windows
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  build-macos:
    name: Build macOS (universal DMG)
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm
          cache-dependency-path: opensquilla-webui/package-lock.json

      - name: Set up Rust (universal targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Import the Developer ID Application certificate into a throwaway
      # keychain. Required for a real codesign + notarization. Skip when the
      # secret is not configured (ad-hoc signed, not notarizable).
      - name: Import macOS signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "MACOS_CERTIFICATE not configured; skipping certificate import (ad-hoc signing only)."
            exit 0
          fi
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/certificate.p12" \
            -k build.keychain -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/notarytool
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain

      - name: Build and release (Tauri, universal)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}
          # Apple notarization (Tauri v2 bundler reads these env vars).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "OpenSquilla ${{ env.RELEASE_TAG }}"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          projectPath: src-tauri
          args: --target universal-apple-darwin --bundles app dmg

      - name: List macOS bundles
        run: |
          find src-tauri/target/universal-apple-darwin/release/bundle -maxdepth 3 -type f -print

      - name: Upload macOS bundles (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: opensquilla-release-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  build-linux:
    name: Build Linux (deb + AppImage)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Run AppImageTool in extract-and-run mode so it works without a FUSE
      # mount on GitHub's virtual runners.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm
          cache-dependency-path: opensquilla-webui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2t64

      - name: Build and release (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "OpenSquilla ${{ env.RELEASE_TAG }}"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          projectPath: src-tauri
          args: --bundles deb appimage

      - name: List Linux bundles
        run: |
          find src-tauri/target/release/bundle -maxdepth 3 -type f -print

      - name: Upload Linux bundles (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: opensquilla-release-linux
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  publish-release:
    name: Publish release assets
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download draft release assets
        run: |
          gh release download "$RELEASE_TAG" --dir dist
          ls -la dist/

      - name: Regenerate SHA256SUMS
        shell: bash
        run: |
          cd dist
          find . -maxdepth 1 -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.sig' -o -name '*.zip' \) \
            -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      # tauri-action generates `latest.json` from the updater plugin config.
      # Validate that it covers every platform before we bless the release.
      - name: Validate update manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("dist/latest.json").read_text(encoding="utf-8"))
          platforms = manifest.get("platforms", {})
          required = {"windows-x86_64", "darwin-x86_64", "darwin-aarch64", "linux-x86_64"}
          missing = required - set(platforms)
          if missing:
              raise SystemExit(f"update manifest missing platforms: {sorted(missing)}")
          for name, entry in platforms.items():
              if not entry.get("signature") or not entry.get("url"):
                  raise SystemExit(f"platform '{name}' is missing signature/url")
              if not entry["url"].startswith("https://github.com"):
                  print(f"note: platform '{name}' url is not a GitHub release URL: {entry['url']}")
          print(f"update manifest OK for {len(platforms)} platforms: {sorted(platforms)}")
          PY

      - name: Upload SHA256SUMS to release
        run: gh release upload "$RELEASE_TAG" dist/SHA256SUMS --clobber

      - name: Verify release assets
        run: |
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,name --jq '{name, isDraft, isPrerelease}'
          echo "--- assets ---"
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort

      - name: Summary
        shell: bash
        run: |
          echo "::notice::OpenSquilla release ${RELEASE_TAG} is a draft. Review assets then publish with:"
          echo "::notice::  gh release edit ${RELEASE_TAG} --draft=false"
