[package]
name = "opensquilla-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Tauri v2 desktop shell for OpenSquilla — replaces the Electron app."
default-run = "opensquilla"

[dependencies]
# OpenSquilla runtime crates (same-process agent runtime).
opensquilla-core = { path = "../crates/core" }
opensquilla-gateway = { path = "../crates/gateway" }
opensquilla-engine = { path = "../crates/engine" }
opensquilla-provider = { path = "../crates/provider" }
opensquilla-session = { path = "../crates/session" }
opensquilla-tools = { path = "../crates/tools" }
opensquilla-cli = { path = "../crates/cli" }
opensquilla-recovery = { path = "../crates/recovery" }
opensquilla-skills = { path = "../crates/skills" }

# Tauri v2 desktop shell.
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "devtools"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"

# Serialization & async runtime.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
thiserror = "2"
anyhow = "1"
url = "2"
reqwest = { version = "0.12", features = ["json", "stream"] }

# Crypto (ownership HMAC/SHA, secret-storage key derivation, update verification).
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
base64 = "0.22"
hex = "0.4"

# IDs / time / errors / paths / concurrency.
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1"
parking_lot = "0.12"
dirs = "6"
regex = "1"
walkdir = "2"
async-trait = "0.1"
dashmap = "6"
futures = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# This feature is enabled by `cargo tauri dev`/`build` and turns on the custom
# protocol that serves the compiled WebUI assets from frontendDist.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "opensquilla_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "opensquilla"
path = "src/main.rs"

# Release binary profile: optimize for size, full LTO, panic-abort. Matches the
# workspace-level profile so CI and local release builds are identical.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
