[package]
name = "opensquilla-gateway"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
opensquilla-core = { path = "../core" }
opensquilla-session = { path = "../session" }
opensquilla-engine = { path = "../engine" }
opensquilla-memory = { path = "../memory" }
opensquilla-sandbox = { path = "../sandbox" }
opensquilla-skills = { path = "../skills" }
opensquilla-scheduler = { path = "../scheduler" }
opensquilla-channels = { path = "../channels" }
opensquilla-recovery = { path = "../recovery" }
opensquilla-tools = { path = "../tools" }
opensquilla-search = { path = "../search" }
opensquilla-onboarding = { path = "../onboarding" }
axum = { workspace = true, features = ["ws", "multipart"] }
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true }
tower-http = { workspace = true, features = ["cors", "catch-panic", "fs"] }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
dashmap = { workspace = true }
